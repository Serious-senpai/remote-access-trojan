# Reference: https://docs.docker.com/reference/compose-file/
name: remote-access-trojan

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: bash -c "socat TCP-LISTEN:8000,fork,reuseaddr TCP:127.0.0.1:12111"
    container_name: devcontainer
    environment:
      CARGO_TARGET_DIR: /target
      RUST_BACKTRACE: "1"
    ports:
      - "5173:5173" # development Vite server
      - "12110:12110" # C&C server
      - "12111:8000" # OpenAPI server (socat-forwarded)
    volumes:
      - ..:/workspaces/remote-access-trojan
    working_dir: /workspaces/remote-access-trojan
