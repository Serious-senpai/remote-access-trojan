name: Build

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.93
          cache: false
          rustflags: ""

      - name: Build Windows executables
        run: |
          cargo build --release -p rat-client
          cargo build --release -p rat-server

      - name: Upload Windows executables
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            target/release/rat-client.exe
            target/release/rat-server.exe

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Save Docker images
        run: |
          mkdir -p build
          docker image ls
          docker save -o build/centos-client.tar rat-centos-client
          docker save -o build/ubuntu-client.tar rat-ubuntu-client
          docker save -o build/server.tar rat-server

      - name: Upload Docker images
        uses: actions/upload-artifact@v7
        with:
          name: docker-images
          path: build
