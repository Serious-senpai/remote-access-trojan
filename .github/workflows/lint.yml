name: Lint

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  rustfmt:
    name: Run rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly,1.94
          components: clippy,rustfmt
          cache: false
          rustflags: ""

      - name: Run rustfmt via cargo fmt
        run: cargo +nightly fmt -- --check

      - name: Run rustfmt via cargo fmt (UEFI)
        working-directory: rat-efi
        run: cargo +nightly fmt -- --check

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly,1.94
          components: clippy,rustfmt
          cache: false
          rustflags: ""

      - name: Run clippy
        run: cargo clippy --all-features --no-deps -- -D warnings

      - name: Run clippy (UEFI)
        working-directory: rat-efi
        run: cargo clippy --all-features --no-deps -- -D warnings
