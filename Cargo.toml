[workspace]
resolver = "2"
members = ["rat-client", "rat-common", "rat-dropper", "rat-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = { version = "1.0.100", default-features = false }
async-trait = { version = "0.1.89", default-features = false }
clap = { version = "4.6.1", default-features = false, features = ["std"] }
const_format = { version = "0.2.36", default-features = false }
futures-util = { version = "0.3.32", default-features = false }
libc = { version = "0.2.186", default-features = false }
log = { version = "0.4.32", default-features = false }
poem = { version = "3.1.12", default-features = false }
poem-openapi = { version = "5.1.16", default-features = false }
postcard = { version = "1.1.3", default-features = false }
rcgen = { version = "0.14.8", default-features = false }
rustls = { version = "0.23.40", default-features = false }
serde = { version = "1.0.228", default-features = false }
serde_json = { version = "1.0.149", default-features = false }
simplelog = { version = "0.12.2", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
slotmap = { version = "1.1.1", default-features = false }
sysinfo = { version = "0.39.3", default-features = false }
tokio = { version = "1.52.3", default-features = false }
tokio-rustls = { version = "0.26.4", default-features = false }
tokio-stream = { version = "0.1.18", default-features = false }
widestring = { version = "1.2.1", default-features = false }
windows-service = { version = "0.8.1", default-features = false }
windows-sys = { version = "0.61.2", default-features = false }
zstd = { version = "0.13.3", default-features = false }

[workspace.lints.clippy]
absolute_paths = "warn"
assigning_clones = "warn"
bool_to_int_with_if = "warn"
branches_sharing_code = "warn"
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
collection_is_never_read = "warn"
elidable_lifetime_names = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
if_not_else = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
manual_instant_elapsed = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
match_same_arms = "warn"
needless_collect = "warn"
needless_continue = "warn"
suboptimal_flops = "warn"
too_many_arguments = "allow"
trait_duplication_in_bounds = "warn"
use_self = "warn"
wildcard_imports = "warn"

[profile.dev]
debug = 2
lto = "off"
opt-level = 0
overflow-checks = true
panic = "unwind"
strip = false

[profile.release]
codegen-units = 1
debug = 0
lto = "fat"
opt-level = 3
overflow-checks = false
panic = "abort"
strip = true
