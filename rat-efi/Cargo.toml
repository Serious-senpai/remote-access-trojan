[package]
name = "rat-efi"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
com_logger = { version = "0.1.2", default-features = false }
log = { version = "0.4.30", default-features = false }
rat-common = { path = "../rat-common", default-features = false }
uefi = { version = "0.37.0", default-features = false, features = ["alloc", "global_allocator", "panic_handler"] }
uefi-raw = { version = "0.14.0", default-features = false }

[dependencies.windows-sys]
version = "0.61.2"
default-features = false
features = [
    "Wdk",
        "Wdk_Foundation",
        "Wdk_System",
            "Wdk_System_SystemServices",
    "Win32",
        "Win32_Security",
        "Win32_System",
            "Win32_System_Diagnostics",
                "Win32_System_Diagnostics_Debug",
            "Win32_System_IO",
            "Win32_System_SystemInformation",
            "Win32_System_SystemServices",
            "Win32_System_WindowsProgramming",
]

[profile.dev]
debug = 2
lto = "off"
opt-level = 0
overflow-checks = true
panic = "unwind"
strip = false

[profile.release]
codegen-units = 1
debug = 0
lto = "fat"
opt-level = 3
overflow-checks = false
panic = "abort"
strip = true

[lints.clippy]
absolute_paths = "warn"
assigning_clones = "warn"
bool_to_int_with_if = "warn"
branches_sharing_code = "warn"
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
collection_is_never_read = "warn"
elidable_lifetime_names = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
if_not_else = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
manual_instant_elapsed = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
match_same_arms = "warn"
needless_collect = "warn"
needless_continue = "warn"
suboptimal_flops = "warn"
too_many_arguments = "allow"
trait_duplication_in_bounds = "warn"
use_self = "warn"
wildcard_imports = "warn"
