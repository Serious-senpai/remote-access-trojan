[package]
name = "rat-server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true, features = ["cargo", "derive", "error-context", "help", "usage"] }
log = { workspace = true }
poem = { workspace = true }
poem-openapi = { workspace = true, features = ["swagger-ui"] }
postcard = { workspace = true, features = ["use-std"] }
rat-common = { path = "../rat-common" }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[lints]
workspace = true
